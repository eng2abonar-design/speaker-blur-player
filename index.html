essed word. We have two categories of words in American English: Content Words and Function Words."],[3679,"Content words are nouns, verbs, like this verb ‘make’, adjectives, and adverbs, and content words are what are generally stressed in a sentence."],[3690,"“Make”: M consonant, AY diphthong, and the K sound, is usually stressed in a"],[3697,"sentence. Make. Make. It has an up-down shape. That’s the stressed shape of intonation. Make."],[3707,"That’s different from: when, when, when, which was flatter in pitch and lower."],[3713,"Make, longer, shape of stress, more clear."],[3718,"Sentences: I’ll make you one. Make. Make. It would make things easier."],[3726,"Make. Make. Number 53. Here, we have a beautiful reduction."],[3734,"#Chapter 38: Word 53"],[3734,"It’s the word ‘can’. If ‘can’ is a main verb, then it’s not reduced. Who can help tomorrow? I can. Also, it doesn’t reduce if it’s a noun: a can of soup."],[3748,"But most of the time, ‘can’ is a helping verb, not a main verb, and that means it reduces. We change a sound."],[3757,"Let’s go back to the example: Who can help tomorrow?"],[3761,"I can. In the question: Who can help tomorrow? ‘Help’ is the main verb. ‘Can’ is the"],[3769,"helping verb. Did you hear how I pronounced it? Who can help tomorrow? Who can help?"],[3775,"It’s no longer ‘can’, but ‘kn’. Who can— Who can help? Short,"],[3782,"flat, no vowel. We write it in IPA with the schwa. Kn, kn, kn. Try that."],[3791,"Kn, who can help? I can see you."],[3795,"‘See’ the main verb, ‘can’ the helping verb. Kn, kn. I can,"],[3802,"I can see you. That’s quite a reduction. Very common. Number 54: The word ‘like’."],[3810,"#Chapter 39: Word 54"],[3810,"This word can be used lots of different ways, so it can be an adverb, a noun, or an adjective, which would mean it’s stressed, or it can be a preposition or"],[3821,"conjunction, which means it will be a function word and is unstressed."],[3826,"However, even when it’s unstressed, this word does not reduce. Let’s look at an example where it’s stressed. I don’t like it."],[3836,"Like. I don’t like it."],[3839,"Here, it’s stressed. Like. Like. Up-down shape of stress. But what about this sentence? He"],[3847,"acted like nothing happened. He acted like— like, like, lower in pitch, much faster."],[3855,"He acted like nothing happened. He acted like nothing happened."],[3860,"Like. Unstressed. None of the sounds change so it doesn’t reduce, but it’s pretty different from the stressed version. Like, like. Like, like, like."],[3874,"One more example, and this is a really common use of the word. We use this when we’re telling a story, something that happened to us, and we’re talking about what someone said or someone’s reaction."],[3886,"For example: Yesterday I saw Jim walking home from school, and I was like,"],[3891,"“Do you need a ride?” And he was like, “No, I’m just going to walk.” I was like, he was like, she was like, you were like, like, like, like, like, like."],[3901,"All of these are examples of ‘like’ unstressed. Number 55: Time."],[3908,"#Chapter 40: Word 55"],[3908,"Now this word, a noun, an adjective, a verb, is always a content word."],[3913,"That means it will likely be stressed. This is only the 6th word in this list so far that is always stressed. We’re on number 55."],[3923,"That’s crazy. So if you thought every word you spoke needed to be clear and fully pronounced, I hope this series is helping to change your mind."],[3934,"This word is pronounced with the True T, because it’s stressed, and it has the AI"],[3938,"as in BUY diphthong, and don’t forget that M. Time. Lips have to come together. Time."],[3946,"There is no case where the lips don’t come together for the M. Always. Time, time."],[3954,"Crisp, clear True T, teeth come together for it: ttt— time, up-down shape of stress. Let’s look at a sentence."],[3965,"What time is it? Time. A noun. Or, you do sit ups for a minute,"],[3971,"and I’ll time you. Time, time. There, it’s a verb, still stressed, same pronunciation."],[3979,"#Chapter 41: Word 56"],[3979,"Number 56: No. Another word, the seventh word, that will generally always be stressed."],[3987,"There is not a case where it would usually reduce or be unstressed. No. No. Up-down shape: No."],[3998,"And please don’t ever forget the lip rounding that goes into this diphthong: oohhh. No."],[4006,"No. I have no idea. He voted ‘no’ on the sugar tax."],[4012,"No, no. That was a simple one, wasn’t it? What about 57?"],[4018,"#Chapter 42: Word 57"],[4018,"57 is interesting. The word ‘just’. It’s either an adjective or an adverb, and those are both content words, so it will generally be stressed."],[4028,"And for the most part, we don’t reduce stressed words. They’re important. We only reduce and say quickly the words that are a little less important, the function words."],[4039,"BUT. This word is interesting because it has a T, and T has its own set of funny"],[4046,"rules. If you’ve seen many of my videos, you know them. I talk about the T pronunciations a lot. If the T comes between two consonants, we often drop that T."],[4058,"Well, that’s a reduction. Let me show you what I mean."],[4061,"When the word ‘just’ is followed by a word that starts with a consonant, there is a good chance that a native speaker will drop the T,"],[4070,"and just say: jus. Jus’ instead of ‘just’. I just thought, why not?"],[4079,"Just, just, just thought. Just thought— just— The ST ending is followed by TH,"],[4087,"the T comes between two consonants, we drop it: jus’ thought, just’ thought. I just missed the bus."],[4096,"I just missed— just missed the bus—S-T-M, drop the T. Jus’ missed, jus’ missed, I just missed the bus."],[4109,"Now, if ‘just’ is followed by a word that begins with a vowel or diphthong, don’t drop the T. Just make it a light, True T."],[4118,"For example, it’s just Alex. Just Alex— just, tt, tt, just Alex."],[4127,"It’s just Alex. Number 58, another word that reduces. This one is a function word:"],[4135,"#Chapter 43: Word 58"],[4135,"him. And just like number 9, “have”, number 16, “he”, number 23, “his”,"],[4144,"number 29, “her”, we often drop the H and link this to the word before."],[4151,"For example, I gave him another one. Gave ‘im, gave ‘im, gave ‘im. A very common reduction."],[4159,"We do this with these function words that begin with an H. Simply schwa-M. Gave ‘im. Gave ‘im."],[4169,"Another example: We want him to succeed. Want him, want him."],[4175,"Wait, what’s happening to the T in ‘want’? I’m dropping the H,"],[4181,"so it doesn’t come between two consonants. Well, we’ll find out soon,"],[4185,"because that’s number 93 on the list of the 100 most common words in English. 59: Know."],[4194,"#Chapter 44: Word 59"],[4194,"You’re thinking, wait, we already did that. That was number 56. Yes, but,"],[4201,"different word. ‘No’ and ‘know’ are homophones. That’s right. That means they sound exactly the same, even though they are two different words and they’re spelled differently."],[4212,"Know. Know. A verb. Usually stressed in a sentence. N consonant, OH diphthong:"],[4221,"know. However, with really common phrases, we often make some reductions,"],[4227,"like how ‘going to’ becomes ‘gonna’. And with the really common phrase “I don’t know”,"],[4235,"we make a reduction. I dunno, I dunno, I dunno. And, this can sound like the last"],[4242,"sound is not OH: I dunno, I dunno, I dunno, I dunno, o, o, o, o, o, o."],[4251,"It’s more like a quick ‘uh’ there. Certainly not: know, oh, oh, with a full and stressed OH diphthong."],[4261,"I don’t know. Number 60, the last word for this video, the word “take”."],[4268,"#Chapter 45: Word 60"],[4268,"Usually a verb, sometimes a noun, it’s a content word. And generally, it’s going to be stressed in a sentence."],[4275,"Just like ‘time’, it’s a one-syllable stressed word that begins with a True T,"],[4281,"tt, AY, then the AY diphthong, and the K sound. Take. Sentences: Can you take me there?"],[4290,"Take, take, take. Or, I need to take it back. Take. Take. Take."],[4298,"Longer, up-down shape, more time, a stressed syllable."],[4304,"In this set, we’ve got some words that are tricky to pronounce, like YEAR and PEOPLE."],[4311,"#Chapter 46: Word 61"],[4311,"Number 61 is the word ‘people’.This is the first time we’re starting one of these videos with a word that is NOT an example of a word that will be unstressed."],[4322,"This word is a noun, a content word, and generally, it will be stressed."],[4327,"Now, this is a tricky word. And I don’t have too many videos where I go over the specific pronunciation of a single word, but I do happen to have one where I talk about this word,"],[4338,"so I’ll put in a clip here that will go through the pronunciation, step-by-step."],[4343,"It’s a two-syllable word with stress on the first syllable. Da-da. People."],[4350,"It begins with the P consonant sound, lips are together for that, pp-."],[4356,"Then we open into the EE as in SHE vowel, pe-, pe-. So the tongue tip is down here, but the front part of the tongue is stretching up towards the roof of the mouth, pe-, pe-."],[4369,"Now we have the P, schwa, L sound. This is unstressed, so it's going to be low in pitch and"],[4375,"very fast, -ple, -ple, -ple. People. So the lips will come together again for the P. People. -ple."],[4384,"Then we go into the schwa/Dark L sound. Don't worry about making a separate schwa sound, just go straight into the Dark sound of the Dark L. So, to make that sound,"],[4394,"your tongue will pull back, so the back part of the tongue here is shifting towards the throat a bit, people, ull, ull. And that's how we get that dark sound."],[4405,"Now, it should be very short because it's unstressed, people, people."],[4411,"The second half of the Dark L involves bringing the tongue tip to the roof of the mouth. People. But you can actually leave that out."],[4419,"A lot of people will just make, people, ull, the Dark sound to signify the Dark L and not necessarily bring the tongue tip up. People,"],[4430,"people. Let’s do a couple of example sentences with people. I’m a people person. People,"],[4438,"people. Up-down shape of stress, longer, more clear than the unstressed words: I’m a-- I’m a-- I’m a people person. What does ‘people person’ mean?"],[4450,"It means that I’m very social. I like interacting with a lot of people, I’m very outgoing, I’m an extrovert. I have room for three more people in my car."],[4460,"People, people. Stressed. Number 62. Is it as clear as ‘people’?"],[4469,"#Chapter 47: Word 62"],[4469,"No. It’s the word ‘into’. ‘Into’ is a preposition. And prepositions"],[4475,"are function words, which means they’ll generally be unstressed i n a sentence. Let me show you what I mean. I ran into my teacher at the movies."],[4485,"I ran into my teacher at the movies. Ran, teach-,"],[4493,"mov-. These are the stressed syllables. All the others, including the word ‘into’, unstressed."],[4501,"Less clear, low in pitch, flatter, given less time. Into. If it was clear and fully pronounced,"],[4509,"it would have that up-down shape of stress, into, and a True T."],[4515,"The final vowel would be the OO as in BOO vowel. Into. But that’s not how I pronounced it. I ran into my teacher."],[4524,"Into. Into. Into."],[4526,"A couple things are different. First of all, it’s not stressed so it’s flat in pitch, low in pitch."],[4534,"Second, two sounds have changed. The T sounds more like a D, and the final vowel is the schwa."],[4541,"Into. into. Into. into. So instead of ‘into’, it’s: into, into."],[4548,"This T is not following the rules of T pronunciations. The rules are, after an N, we can drop a T completely, but if not,"],[4557,"it’s a True T. But many Americans will say ‘into’ more of a D or Flap T sound connected to the N."],[4566,"If you only learned the stressed pronunciation of this and every word in American English,"],[4572,"your English wouldn’t sound too natural, because we use so many reductions so frequently. Number 63: the word ‘year’."],[4581,"#Chapter 48: Word 63"],[4581,"A noun, a content word. This is a word that will generally be stressed in a sentence. No reduction here. Year. Year. Up-down shape of stress."],[4593,"Longer, clearer than the unstressed words in a sentence will be. A lot of people"],[4598,"have problems with the pronunciation of this word because of the Y sound. Year. How is it different from ‘ear’? I actually have a video on that. Let me put in a little clip here."],[4613,"‘Year’ and ‘ear’ are exactly the same except for the Y sound."],[4618,"The main vowel is the IH as in SIT vowel, but I do feel like we squeeze it a little bit,"],[4625,"so it sounds a little more like EE. IH, ear. EE, ear. Ear. Let’s take a look."],[4638,"First, the word ‘ear’. For the IH or EE vowel, the jaw drops just a bit, and the corners of the lips pull out wide,"],[4648,"just a little. The tongue tip is down here, touching the back of the bottom front teeth."],[4654,"#Chapter 49: Word 64"],[4654,"The front part arches towards the roof of the mouth without touching it. Next is the schwa-R sound."],[4661,"Look for the tongue pulling back as the lips flare. The tongue pulls back and up, with the"],[4668,"tip pointing down so it’s not touching anything. Now, let’s take a look at ‘year’. The jaw dropped"],[4676,"a little bit more here. Why? To accommodate the movement of the tongue. While the tip is down in"],[4683,"the same position for the next vowel, the middle part of the tongue actually touches the roof of"],[4688,"the mouth and pushes forward a bit. yy, yy. At the same time, the throat closes off down here,"],[4701,"yy--, yy--, yy--, to add a different dimension to the sound. Ee, yy, ee, yy. Let’s watch the"],[4711,"Y several times to see that motion of the tongue pulling down from the roof of the mouth: yy, yy."],[4727,"Now, the lips flare and the tongue pulls back for the R."],[4733,"Now let’s compare the beginning position of these two words. ‘Ear’ is on the left and ‘year’ is on the right."],[4741,"Notice that the jaw has dropped more for the forward motion of the tongue on the roof of the mouth for ‘year’."],[4749,"Also, the corners of the lips are more relaxed than for the initial vowel in ‘ear’, where they pull slightly out. You can see this from the front as well."],[4761,"The jaw has dropped more for the tongue movement. So, we have the tongue movement, which is different for the Y, as well as the Y sound in the throat, yy."],[4774,"This is how we want to start the word ‘year’: yy, yy, year. Now I’ll say the minimal pair several times."],[4785,"Can you hear the difference? Year. Ear."],[4792,"Year. Ear. Year. Ear."],[4801,"Year. Let’s do a sentence or two. We’re going to Italy this year. Year."],[4808,"Year. It’s the last word in the thought group, and naturally in American English,"],[4814,"our energy and our pitch goes down in a sentence, so the ending word is often less clear, even if it’s stressed,even if it’s a content word like ‘year’."],[4825,"But it still has the length of a stressed syllable. We’re going to Italy this year. Year, year."],[4833,"A little bit of that up-down shape of stress. What year were you born?"],[4838,"Year, year. There the word ‘year’ is closer to the beginning of the sentence, so it’s a little clearer."],[4846,"Year. Number 64: Another great reduction. The word ‘your’. This is related to the word ‘or’, which was number 31."],[4857,"Fully pronounced, ‘your’ and ‘or’ rhyme with ‘more’ or ‘wore’. But they’re"],[4864,"almost never fully pronounced. They’re almost always reduced in a sentence, ‘yer’, ‘er’. So the vowel changes to the schwa."],[4872,"Stressed: Your. Fully pronounced, longer, up-down shape of stress."],[4879,"But in a sentence: yer, yer. Unstressed, low in pitch, said quickly. Yer."],[4887,"Sample sentence: What’s your name? Yer, yer, yer."],[4891,"Yer name. Can I borrow your car? Yer, yer, yer. Borrow your car? In this question:"],[4899,"Can I borrow your car? Can I bor-- car-- Those are the two stressed syllables. ‘Can’ and ‘your’ reduced: can--, your--, and ‘I’ is unstressed."],[4913,"Can I borrow your car?"],[4915,"What would it sound like if they were all stressed? If they were all said very clearly, fully pronounced?"],[4923,"Can I borrow your car? Can I borrow your car? Can I borrow your car? Can I borrow your car?"],[4931,"Completely unnatural. Can I borrow your car?"],[4934,"It’s so important to learn about reductions, and learn about the unstressed pronunciation of words, so that you can sound more natural, more relaxed,"],[4944,"and be more easily understood. You’re in the right place for this. Okay, let’s keep going. Number 65: Good."],[4954,"#Chapter 50: Word 65"],[4954,"This is our first word in the 100 most common words in English list"],[4959,"that’s primarily an adjective. An adjective is a content word. Content words are nouns,"],[4965,"verbs, adjectives, and adverbs. And content words are what are generally will be stressed in a sentence. Good. Good. Up-down shape. Good."],[4977,"Longer, clearer. The O here represents the UH sound, like in push, or book."],[4986,"Good. Uh. The D is a stop consonant, and stop consonants have two parts,"],[4992,"a stop of air, and a release. Good. Good. Stop and release."],[5001,"But with stop consonants, it’s common to skip the release. Then,"],[5005,"the D becomes a lot more subtle. I want to show you what I mean. Good. ddd--"],[5013,"My tongue is lifted into position for the D, and my vocal cords make a sound. Dddd. Good. Good. Good."],[5023,"Do you hear it at the end? It’s clearer on its own."],[5027,"Dddd-- But of course, we never use it that way. It’s always part of a word or sentence. And that can mean it’s harder here: good, good, ddd--, good."],[5040,"Pronouncing your D this way will help your English sound natural."],[5045,"If you’re linking the D into a word that begins with a vowel or diphthong, then it will sound like a flap. Let’s look at an example."],[5053,"I feel good about the project. Good about, good about. Goo-- ddd-- Good about."],[5060,"There, the next word begins with a vowel sound, so I flap the tongue and connect the two words. Good about."],[5068,"It’s a good restaurant. Good—dd—restaurant. There, I make a very quick D sound in the vocal cords, before going into the R."],[5077,"Good restaurant. 66, the word ‘some’. This word generally reduces and can be said very quickly in sentences."],[5087,"#Chapter 51: Word 66"],[5087,"It depends on how the word is being used. For example, if it’s being used to show that something was great, or unique, like, “That was some party!”, then it’s fully pronounced."],[5098,"Also, if it can be switched out for the word ‘certain’, then it’s stressed: Some days I work from home, and some days I go to the office."],[5107,"Fully pronounced: some, some. Up-down shape, length, UH as in butter vowel. But usually,"],[5116,"it’s not stressed, it’s actually reduced. Then it’s more like: some, some, some. Flat, low in pitch, said very quickly, and the vowel reduces to the schwa."],[5131,"Some. Some. Some."],[5131,"We pronounce it this way when we use ‘some’ to mean an unknown amount, or unit, or thing. Some water."],[5139,"May I have some water? Some, some. We need some more volunteers. Some, some. Some more."],[5147,"Some. Said very quickly, low in pitch, flat: some."],[5155,"Stressed: some. Unstressed: sum. Number 67, the word “could”."],[5161,"#Chapter 52: Word 67"],[5161,"Actually, we’ve already gone over this word. We did that when we talked about ‘would’, number 37. Number 68. Another word that reduces, the word ‘them’."],[5173,"#Chapter 53: Word 68"],[5173,"A pronoun, which is a function word. Fully pronounced, the word has the voiced TH, which I know is a tricky sound, the EH as in BED vowel, and the M consonant. Them."],[5187,"I have good news for you if the TH is one of your hardest sounds: This reduction involves dropping the TH. So,"],[5195,"let me give you an example sentence. We gave them the tickets. Gave ‘em. We gave ‘em money."],[5203,"Gave ‘em. Gave ‘em. You might be thinking, wait, we already studied ‘gave ‘im’, and it was when"],[5210,"we were talking about “him!” Yes. Both ‘him’ and ‘them’ sound the same when reduced. So,"],[5218,"“we gave him money” will sound just like “we gave them money.” It doesn’t matter that they sound the same. We use a pronoun when we’ve established who we’re talking about."],[5229,"So these two pronouns sounding the same shouldn’t add any confusion to your conversation. You can"],[5236,"pronounce it quickly with the TH: them, them, them, them. But you’ll also hear"],[5241,"it with the TH dropped, and this is something you can do in conversational English too. Number 69: See."],[5249,"#Chapter 54: Word 69"],[5249,"This is a verb, a content word, and generally yes, this will always be"],[5254,"stressed in a sentence. We’re on number 69 here of the 100 most common words in English,"],[5261,"and there have only been a handful of words where it’s never stressed. Wow. Unstressed words? So common."],[5269,"Reductions? So common. See is a simple word, just two sounds,"],[5276,"the S consonant and the EE as in SHE vowel. See. See. Stressed with an up-down shape: see, see."],[5287,"And it will be one of the longer syllables in a sentence. I didn’t see you there. See. See."],[5294,"Or: The CEO asked to see me. See. Number 70: the word ‘other’."],[5302,"This word can be used as an adjective, a noun, a pronoun, so, this word can be"],[5308,"#Chapter 55: Word 70"],[5308,"both a content word and a function word. It can be stressed or unstressed. For example, stressed: I don’t love it, on the other hand, it is cheaper."],[5320,"Other. Other. Or, I read about that just the other day. Other. Other."],[5328,"It’s usually stressed, but it can be unstressed. For example, Someone or other will help out. Someone or other. Or other, or other, or other, or other."],[5338,"Other, other, other. Lower in pitch, a little mumbled, less clear. However, I don’t change any"],[5345,"of the sounds so it’s just unstressed, not reduced. In the stressed syllable, we have the UH as in BUTTER vowel and voiced TH, oth, oth."],[5357,"Just the very tip of the tongue comes through the teeth for that TH. Oth, th, th, th. Other. Then the schwa R ending in the unstressed syllable. Other."],[5370,"In the next set of 10, and you’ll learn another important reduction. Today, we start with number seventy-one, and that’s the word ‘than’."],[5379,"#Chapter 56: Word 71"],[5379,"Fully pronounced, we have voiced TH, AA as in BAT, followed by the M consonant. Than."],[5387,"Than. When AA is followed by N, we relax the back of the tongue and change the sound: thaaa— thaa— than."],[5399,"Than. Aa-uh, aa-uh. So it’s not aahh thaaan, thaaan, but"],[5405,"‘than’, aa-uh, aa-uh, aa-uh. There’s an extra sound in there from relaxing the"],[5410,"back of the tongue, sort of like an UH vowel. Thaaaa— Than. Than. Than. But we don’t need to"],[5419,"focus too much on the full pronunciation of this word since it is a word that reduces."],[5425,"Remember, when a word reduces, that’s called a reduction, and that’s when we change or drop a sound. So rather than saying ‘than’ in a conversation, it will be ‘thn’."],[5437,"We change the vowel to the schwa, which is absorbed by the N, so you don’t even need to think about making a vowel there. Than, than, than, from the TH to the N."],[5448,"Very fast. Than. We use this with comparisons: she’s taller than I am, than, than, than I am."],[5457,"They’re older than we are. Than, than, older than. Taller than, older than, than, than, than."],[5465,"A reduction, not a fully pronounced word. If you go around fully pronouncing every word, it will not sound natural, so you need to know and use these reductions."],[5477,"#Chapter 57: Word 72"],[5477,"Number seventy-two, a very similar word, ‘then’. THAN is used with comparisons, and THEN is used"],[5485,"with timing, sequences, and if/then statements. It got really dark, then it stormed a       items.push({ t: d[0], el: el, h: true, text: el.textContent });
    } else {
      el.className = 's'; el.textContent = d[1];
      items.push({ t: d[0], el: el, h: false });
    }
    list.appendChild(el);
  });
  var segs = items.filter(function (i) { return !i.h; });
  var heads = items.filter(function (i) { return i.h; });
  var cur = -1, player = null, ready = false, playing = false;

  function find(arr, t) {
    var lo = 0, hi = arr.length - 1, r = -1;
    while (lo <= hi) { var m = (lo + hi) >> 1; if (arr[m].t <= t) { r = m; lo = m + 1; } else hi = m - 1; }
    return r;
  }
  function show(t, scroll) {
    var i = find(segs, t);
    if (i === cur) return;
    if (cur >= 0 && segs[cur]) segs[cur].el.classList.remove('on');
    cur = i;
    if (i >= 0) {
      segs[i].el.classList.add('on');
      if (i > 0) segs[i - 1].el.classList.add('past');
      if (scroll !== false) segs[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
    var h = find(heads, t);
    document.getElementById('chtxt').textContent = h >= 0 ? heads[h].text : '';
  }
  segs.forEach(function (s, idx) {
    s.el.onclick = function () { if (ready) { player.seekTo(s.t, true); player.playVideo(); } else { START = s.t; } show(s.t); };
  });

  function setBtn(p) {
    playing = p;
    document.getElementById('play').textContent = p ? '❚❚' : '▶';
    document.getElementById('state').textContent = p ? 'شغّال' : 'واقف';
  }
  document.getElementById('play').onclick = function () {
    if (!ready) return;
    if (playing) player.pauseVideo(); else player.playVideo();
  };

  window.onYouTubeIframeAPIReady = function () {
    player = window.ytp = new YT.Player('yt', {
      width: '200', height: '200', videoId: 'y5kl9MU1urc',
      playerVars: { start: START, playsinline: 1, controls: 0, rel: 0, modestbranding: 1, cc_load_policy: 0, disablekb: 1 },
      events: {
        onReady: function () { ready = true; document.getElementById('state').textContent = 'اضغط تشغيل'; },
        onStateChange: function (e) { setBtn(e.data === 1 || e.data === 3); }
      }
    });
  };
  var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);

  setInterval(function () {
    if (ready && player && player.getCurrentTime) { show(player.getCurrentTime()); }
  }, 300);

  show(START, false);
  if (segs.length) { var i0 = find(segs, START); if (i0 >= 0) segs[i0].el.scrollIntoView({ block: 'center' }); }
})();
</script>
</body>
</html>
