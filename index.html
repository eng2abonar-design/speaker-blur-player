<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>مشغّل بدون صورة المتحدث</title>
<style>
  :root { --bg:#eef2f7; --card:#fff; --ink:#1d2733; --muted:#5b6b7c; --accent:#2563eb; --line:#d8e0ea; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Segoe UI",Tahoma,Arial,sans-serif; font-size:18px; }
  .wrap { max-width:900px; margin:0 auto; padding:12px; }
  .player { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:14px; overflow:hidden; }
  .player iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  #mask { position:absolute; top:0; bottom:20%; width:var(--w,55%); background:#23272e; pointer-events:none; }
  #mask.left { left:0; }
  #mask.right { right:0; }
  #mask.off { display:none; }
  .card { background:var(--card); border-radius:16px; padding:14px; margin-top:12px; box-shadow:0 2px 10px rgba(20,40,70,.08); }
  .lbl { font-size:15px; color:var(--muted); margin:0 0 6px; }
  .grp { display:grid; gap:8px; margin-bottom:12px; }
  .g3 { grid-template-columns:repeat(3,1fr); }
  .g3w { grid-template-columns:1fr 1.2fr 1fr; }
  .grp button { padding:16px 4px; border:0; border-radius:12px; background:#e6ecf5; color:var(--ink); font-size:20px; font-weight:700; }
  .grp button.on { background:var(--accent); color:#fff; }
  #wv { display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; }
  .row { display:flex; gap:8px; }
  input { flex:1; min-width:0; padding:12px; border:1px solid var(--line); border-radius:10px; font-size:16px; direction:ltr; }
  .go { padding:12px 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:16px; }
  .hint { color:var(--muted); font-size:15px; line-height:1.7; margin:10px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="player" id="player"><div id="mask" class="left"></div></div>

  <div class="card">
    <p class="lbl">جهة صورة المتحدث</p>
    <div class="grp g3" id="side">
      <button data-s="left" class="on">يسار</button>
      <button data-s="right">يمين</button>
      <button data-s="off">بدون غطاء</button>
    </div>
    <p class="lbl">عرض الغطاء</p>
    <div class="grp g3w">
      <button id="minus">−</button>
      <div id="wv">55%</div>
      <button id="plus">+</button>
    </div>
    <div class="row">
      <input id="url" type="text" placeholder="رابط يوتيوب">
      <button class="go" id="go">تشغيل</button>
    </div>
    <p class="hint">الغطاء بيخفي جانب المتحدث، والكلام الإنجليزي على الجانب التاني بيفضل واضح. الترجمة والأزرار في الشريط السفلي بتفضل ظاهرة. اضغط على الفيديو مرة لبدء التشغيل. لو لسه ظاهر جزء من الصورة، كبّر العرض بزرار +.</p>
  </div>
</div>

<script>
(function () {
  var DEFAULT = 'https://www.youtube.com/watch?v=y5kl9MU1urc&t=3472s';
  var player = document.getElementById('player');
  var mask = document.getElementById('mask');
  var urlBox = document.getElementById('url');
  var st = { s: 'left', w: 55 };

  function parse(u) {
    var id = null, start = 0, m;
    m = u.match(/[?&]v=([\w-]{11})/) || u.match(/youtu\.be\/([\w-]{11})/) || u.match(/embed\/([\w-]{11})/) || u.match(/^([\w-]{11})$/);
    if (m) id = m[1];
    m = u.match(/[?&#]t=(?:(\d+)h)?(?:(\d+)m)?(\d+)?s?/);
    if (m) start = (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0);
    return { id: id, start: start };
  }
  function load(u) {
    var p = parse(u);
    if (!p.id) { urlBox.value = ''; urlBox.placeholder = 'الرابط غير صحيح'; return; }
    urlBox.value = u;
    var old = player.querySelector('iframe'); if (old) old.remove();
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube.com/embed/' + p.id + '?start=' + p.start + '&rel=0&playsinline=1&cc_load_policy=1&cc_lang_pref=en&hl=en';
    f.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
    f.allowFullscreen = true;
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    player.insertBefore(f, mask);
  }
  function render() {
    mask.className = st.s;
    mask.style.setProperty('--w', st.w + '%');
    document.getElementById('wv').textContent = st.w + '%';
    [].forEach.call(document.querySelectorAll('#side button'), function (b) { b.classList.toggle('on', b.dataset.s === st.s); });
    try { localStorage.setItem('ysm-v2', JSON.stringify(st)); } catch (e) {}
  }

  document.getElementById('side').addEventListener('click', function (e) {
    if (e.target.dataset && e.target.dataset.s) { st.s = e.target.dataset.s; render(); }
  });
  document.getElementById('minus').onclick = function () { st.w = Math.max(20, st.w - 5); render(); };
  document.getElementById('plus').onclick = function () { st.w = Math.min(85, st.w + 5); render(); };
  document.getElementById('go').onclick = function () { load(urlBox.value.trim()); };

  try { var d = JSON.parse(localStorage.getItem('ysm-v2') || 'null'); if (d && d.s && d.w) st = d; } catch (e) {}
  var q = new URLSearchParams(location.search);
  if (q.get('s')) st.s = q.get('s');
  if (q.get('w')) st.w = +q.get('w') || st.w;
  render();
  load(q.get('u') || DEFAULT);
})();
</script>
</body>
</html>
